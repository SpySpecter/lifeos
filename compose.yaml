# LifeOS – lokal: `docker compose up --build`, auf dem VPS: Image aus GHCR (deploy/bootstrap-vps.sh)
services:
  lifeos:
    image: ghcr.io/spyspecter/lifeos:latest
    build: .
    container_name: lifeos
    restart: unless-stopped
    env_file: .env
    # Nur Loopback! Erreichbar ist LifeOS ausschließlich über `tailscale serve` (HTTPS im Tailnet).
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
